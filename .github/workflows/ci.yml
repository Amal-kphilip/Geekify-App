name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, Lint and Assemble Debug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not set — using placeholder google-services.json."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_id": "geekify-40226",
              "project_number": "000000000000",
              "firebase_url": "",
              "storage_bucket": ""
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.geekify.android" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run tests, lint, and assemble debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :innertube:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            innertube/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*
            innertube/build/reports/lint-results*
          if-no-files-found: ignore

  backend-tests:
    name: "Backend: Python tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run Python unit tests
        working-directory: backend
        run: python -m unittest -v test_rec_service
