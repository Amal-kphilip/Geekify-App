name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Validate release tag and derive version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major_num=$((10#${BASH_REMATCH[1]}))
            minor_num=$((10#${BASH_REMATCH[2]}))
            patch_num=$((10#${BASH_REMATCH[3]}))
            if (( minor_num <= 99 && patch_num <= 99 )); then
              version_name="${major_num}.${minor_num}.${patch_num}"
              version_code=$((major_num * 10000 + minor_num * 100 + patch_num))
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "version=${version_name}" >> "$GITHUB_OUTPUT"
              echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Invalid semantic version tag '$RELEASE_TAG': minor and patch components must be at most 99."
              exit 1
            fi
          else
            echo "::error::Release workflow requires a semantic version tag matching vMAJOR.MINOR.PATCH (got '$RELEASE_TAG')."
            exit 1
          fi

      - name: Restore and verify release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Release signing credentials (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are required. Refusing to fall back to a debug-signed APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not set — using placeholder google-services.json."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_id": "geekify-40226",
              "project_number": "000000000000",
              "firebase_url": "",
              "storage_bucket": ""
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.geekify.android" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run unit tests, lint, and assemble signed release APK (R8 enabled)
        id: build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.release_version.outputs.version }}
          VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew \
            :innertube:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

          APK_PATH="$(find app/build/outputs/apk/release -name '*-release.apk' | head -1)"
          if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
            echo "::error::Signed release APK was not produced."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          if [[ -n "$APKSIGNER" ]]; then
            CERT_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
            echo "$CERT_INFO"
            if echo "$CERT_INFO" | grep -Fq "CN=Android Debug"; then
              echo "::error::Release APK is signed with the Android debug certificate. Aborting publish."
              exit 1
            fi
          fi

          echo "APK resolved: $APK_PATH"
          cp "$APK_PATH" "Geekify-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "Geekify-latest.apk"
          sha256sum "Geekify-v${VERSION_NAME}.apk" | awk '{ print $1 }' > "Geekify-v${VERSION_NAME}.apk.sha256"
          sha256sum "Geekify-latest.apk" | awk '{ print $1 }' > "Geekify-latest.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSIONED_APK="Geekify-${TAG}.apk"
          LATEST_APK="Geekify-latest.apk"
          VERSIONED_SHA="${VERSIONED_APK}.sha256"
          LATEST_SHA="${LATEST_APK}.sha256"

          # Create or resume draft release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes
          fi

          # Upload only missing assets (idempotent on reruns)
          EXISTING_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for ASSET in "$VERSIONED_APK" "$LATEST_APK" "$VERSIONED_SHA" "$LATEST_SHA"; do
            if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq "$ASSET"; then
              echo "Asset already present, skipping: $ASSET"
            else
              gh release upload "$TAG" "$ASSET"
            fi
          done

          # Publish the draft
          gh release edit "$TAG" --draft=false

      - name: Check optional Firebase FCM sender credentials
        id: fcm_credentials
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.GEEKIFY_FCM_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [[ -n "$FCM_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEEKIFY_FCM_SERVICE_ACCOUNT_JSON is not set; instant update pushes are skipped. WorkManager remains the fallback."
          fi

      - name: Authenticate to Firebase Cloud Messaging
        id: fcm_auth
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: geekify-40226
          credentials_json: ${{ secrets.GEEKIFY_FCM_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
        continue-on-error: true

      - name: Warn if Firebase authentication failed
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' && steps.fcm_auth.outcome != 'success' }}
        run: echo "::warning::FCM authentication failed; published APK remains available and WorkManager remains the fallback."

      - name: Notify Geekify update subscribers
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' && steps.fcm_auth.outcome == 'success' }}
        env:
          ACCESS_TOKEN: ${{ steps.fcm_auth.outputs.access_token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        shell: bash
        run: |
          payload="$(jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg version_code "$RELEASE_VERSION_CODE" \
            '{
              message: {
                topic: "geekify_updates",
                data: {
                  type: "app_update",
                  version: $version,
                  version_code: $version_code
                },
                android: {
                  priority: "high",
                  ttl: "604800s",
                  collapse_key: "geekify-app-update"
                }
              }
            }')"

          if ! curl --fail-with-body --silent --show-error \
            --request POST \
            "https://fcm.googleapis.com/v1/projects/geekify-40226/messages:send" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --data "$payload"; then
            echo "::warning::FCM update push failed; the published release is intact and WorkManager remains the fallback."
          fi
