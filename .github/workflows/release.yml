name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set — APK will be debug-signed (installable, but not Play-signed)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON_BASE64" ]]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 secret is not set — using placeholder google-services.json."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_id": "geekify-40226",
              "project_number": "000000000000",
              "firebase_url": "",
              "storage_bucket": ""
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.geekify.android" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Build APK
        id: build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_AVAILABLE: ${{ steps.keystore.outputs.available }}
        run: |
          chmod +x gradlew
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="$(echo "$VERSION_NAME" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')"

          if [[ "$KEYSTORE_AVAILABLE" == "true" ]]; then
            echo "Building release APK with release signing..."
            ./gradlew :app:assembleRelease \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE" \
              -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
            APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          else
            echo "Building debug APK (debug-signed — installable on any device)..."
            ./gradlew :app:assembleDebug \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE"
            APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          fi

          echo "APK resolved: $APK_PATH"
          cp "$APK_PATH" "Geekify-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "Geekify-latest.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSIONED_APK="Geekify-${TAG}.apk"
          LATEST_APK="Geekify-latest.apk"

          # Create or resume draft release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes
          fi

          # Upload only missing assets (idempotent on reruns)
          EXISTING_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for ASSET in "$VERSIONED_APK" "$LATEST_APK"; do
            if printf '%s\n' "$EXISTING_ASSETS" | grep -Fxq "$ASSET"; then
              echo "Asset already present, skipping: $ASSET"
            else
              gh release upload "$TAG" "$ASSET"
            fi
          done

          # Publish the draft
          gh release edit "$TAG" --draft=false

      - name: Validate stable release version for update notification
        id: release_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            major_num=$((10#$major))
            minor_num=$((10#$minor))
            patch_num=$((10#$patch))
            if (( minor_num <= 99 && patch_num <= 99 )); then
              echo "valid=true" >> "$GITHUB_OUTPUT"
              echo "version=${major_num}.${minor_num}.${patch_num}" >> "$GITHUB_OUTPUT"
              echo "version_code=$((major_num * 10000 + minor_num * 100 + patch_num))" >> "$GITHUB_OUTPUT"
            else
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping FCM notification: minor and patch components must be at most 99."
            fi
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping FCM notification for non-stable semantic version tag '$RELEASE_TAG'."
          fi

      - name: Check optional Firebase FCM sender credentials
        id: fcm_credentials
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.GEEKIFY_FCM_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [[ -n "$FCM_SERVICE_ACCOUNT_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GEEKIFY_FCM_SERVICE_ACCOUNT_JSON is not set; instant update pushes are skipped. WorkManager remains the fallback."
          fi

      - name: Authenticate to Firebase Cloud Messaging
        id: fcm_auth
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: geekify-40226
          credentials_json: ${{ secrets.GEEKIFY_FCM_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging
          access_token_lifetime: 300s
        continue-on-error: true

      - name: Warn if Firebase authentication failed
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' && steps.fcm_auth.outcome != 'success' }}
        run: echo "::warning::FCM authentication failed; published APK remains available and WorkManager remains the fallback."

      - name: Notify Geekify update subscribers
        if: ${{ steps.release_version.outputs.valid == 'true' && steps.fcm_credentials.outputs.configured == 'true' && steps.fcm_auth.outcome == 'success' }}
        env:
          ACCESS_TOKEN: ${{ steps.fcm_auth.outputs.access_token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release_version.outputs.version_code }}
        shell: bash
        run: |
          payload="$(jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg version_code "$RELEASE_VERSION_CODE" \
            '{
              message: {
                topic: "geekify_updates",
                data: {
                  type: "app_update",
                  version: $version,
                  version_code: $version_code
                },
                android: {
                  priority: "high",
                  ttl: "604800s",
                  collapse_key: "geekify-app-update"
                }
              }
            }')"

          if ! curl --fail-with-body --silent --show-error \
            --request POST \
            "https://fcm.googleapis.com/v1/projects/geekify-40226/messages:send" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json; charset=UTF-8" \
            --data "$payload"; then
            echo "::warning::FCM update push failed; the published release is intact and WorkManager remains the fallback."
          fi
